<section class="mx-page mx-saved" aria-label="Saved posts">
<header class="mx-page-heading">
<div>
<p class="mx-eyebrow">YOUR COLLECTION</p>
<h1>Saved moments</h1>
<p class="mx-subtitle">A private place for everything worth remembering.</p>
</div>
<button class="mx-btn mx-btn-primary" (click)="showNew=!showNew">＋ New collection</button>
</header>
<form class="mx-new-collection mx-card" *ngIf="showNew" (ngSubmit)="create()">
<label>Collection name<input name="collection" [(ngModel)]="newName" maxlength="60" placeholder="Inspiration, Travel, Ideas...">
</label>
<button type="submit" class="mx-btn mx-btn-primary" [disabled]="!newName.trim()">Create</button>
</form>
<div class="mx-workspace-controls">
<div class="mx-chips mx-scroll-x">
<button [class.active]="selected==='all'" (click)="choose('all')">All saved</button>
<button *ngFor="let c of collections" [class.active]="selected===c" (click)="choose(c)">{{c}}</button>
</div>
<div class="mx-search-field">
<span>⌕</span>
<input [(ngModel)]="search" placeholder="Find a saved post" aria-label="Search saved posts" type="search"/>
</div>
</div>
<p *ngIf="error" role="alert" class="mx-inline-error">{{error}}</p>
<div class="mx-saved-grid">
<article class="mx-saved-card" *ngFor="let p of filtered;trackBy:id">
<button class="mx-saved-thumbnail" (click)="savedOpen.emit(p.id)" [attr.aria-label]="'Open '+(p.caption||'post')">
<img *ngIf="p.mediaUrl" [src]="p.mediaUrl" [alt]="p.caption||'Saved post'" loading="lazy"/>
<span *ngIf="!p.mediaUrl">✧</span>
<i *ngIf="p.mediaType==='video'">▶</i>
</button>
<div class="mx-saved-caption">
<b>{{p.author.username}}</b>
<p>{{p.caption||'Saved post'}}</p>
<button (click)="savedRemove.emit(p.id)" [disabled]="busy" aria-label="Remove from saved" title="Unsave">◇</button>
</div>
</article>
</div>
<div *ngIf="!loading&&!filtered.length" class="mx-empty">
<span class="mx-empty-icon">◇</span>
<b>Nothing saved here yet</b>
<p>Save a post to come back to it whenever you like.</p>
</div>
</section>
